name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    name: xenv core tests (sh + dash)
    steps:
      - uses: actions/checkout@v4
      - name: install dash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash
      - name: run tests under /bin/sh
        run: test/run.sh
      - name: run tests under /usr/bin/dash
        run: SHELL_BIN=/usr/bin/dash test/run.sh

  macos:
    runs-on: macos-latest
    name: xenv core tests (macOS / LibreSSL default + brew openssl@3)
    steps:
      - uses: actions/checkout@v4
      # macOS ships LibreSSL as /usr/bin/openssl (no `openssl kdf`); the tool
      # must auto-detect a real OpenSSL 3.x (Homebrew's openssl@3). This job
      # exercises that path on genuine hardware.
      - name: "default openssl (expected LibreSSL)"
        run: /usr/bin/openssl version || true
      - name: ensure openssl@3 (brew)
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: run tests under /bin/sh
        run: test/run.sh

  freebsd:
    runs-on: ubuntu-latest
    name: xenv core tests (FreeBSD / BSD userland)
    steps:
      - uses: actions/checkout@v4
      # Real BSD /bin/sh (Almquist) + BSD coreutils + FreeBSD base OpenSSL 3.x,
      # in a VM. Covers the *BSD target that macOS (Mach/BSD-ish) doesn't fully.
      - name: run tests in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            openssl version
            sh test/run.sh

  netbsd:
    runs-on: ubuntu-latest
    name: xenv core tests (NetBSD / BSD userland)
    steps:
      - uses: actions/checkout@v4
      # NetBSD base ships OpenSSL 3.x, so detection finds it on PATH.
      - name: run tests in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            openssl version
            sh test/run.sh

  openbsd:
    runs-on: ubuntu-latest
    name: xenv core tests (OpenBSD / LibreSSL base + pkg openssl)
    steps:
      - uses: actions/checkout@v4
      # OpenBSD ships LibreSSL as base (no `openssl kdf`); install a pkg
      # OpenSSL 3.x and point $XENV_OPENSSL at it — the recommended OpenBSD
      # usage (mirrors the macOS story, but with no Homebrew keg to autodetect).
      - name: run tests in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add -I openssl%3.5
          run: |
            echo "base: $(/usr/bin/openssl version)"   # LibreSSL
            XENV_OPENSSL=""
            # the OpenBSD openssl package installs versioned binaries
            # (e.g. /usr/local/bin/eopenssl35); pick the first 3.x/4.x one.
            for c in /usr/local/bin/eopenssl* /usr/local/bin/openssl*; do
              [ -x "$c" ] || continue
              case "$("$c" version 2>/dev/null)" in
                "OpenSSL 3."*|"OpenSSL 4."*) XENV_OPENSSL="$c"; break ;;
              esac
            done
            export XENV_OPENSSL
            echo "XENV_OPENSSL=${XENV_OPENSSL:-<none found>}"
            [ -n "$XENV_OPENSSL" ] || { echo "no OpenSSL 3.x from pkg"; exit 1; }
            "$XENV_OPENSSL" version
            sh test/run.sh

  alpine:
    runs-on: ubuntu-latest
    name: xenv core tests (Alpine / busybox ash + openssl)
    steps:
      - uses: actions/checkout@v4
      # Run the suite inside Alpine so it's exercised under BusyBox ash +
      # BusyBox coreutils (awk/od/mktemp/cksum) + Alpine's OpenSSL 3.x — the
      # minimal-container target. `docker run` keeps checkout's node action on
      # the host (an Alpine job container would lack node for the action).
      - name: run tests under busybox ash in Alpine
        run: |
          docker run --rm -v "$PWD":/x:ro -w /x alpine:latest sh -c '
            apk add --no-cache openssl >/dev/null
            echo "openssl: $(openssl version)"
            echo "shell:  $(/bin/busybox | head -1)"
            sh test/run.sh
          '

  recipes:
    runs-on: ubuntu-latest
    name: recipe round-trip tests (python, node, ruby, go, rust, php, java, csharp, elixir)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: erlef/setup-beam@v1
        with: { otp-version: '27', elixir-version: '1.17' }
      - name: install php (for the gemini-built recipe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      # Rust is preinstalled on ubuntu-latest via rustup; no setup needed.
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            recipes/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('recipes/rust/Cargo.toml') }}
      - name: build recipes
        run: recipes/build
      - name: run recipe test rig
        run: recipes/test
